<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seal Colony Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="top-header">
      <div>
        <p class="eyebrow">MVP Colony Simulation</p>
        <h1>Icewhisker Seal Colony</h1>
      </div>
      <div class="resource-strip" aria-label="Main resources">
        <span>🌊 Sea Fish <strong id="seaFishValue">0 / 0</strong></span>
        <span>🐟 Stored Fish <strong id="storedFishValue">0 / 0</strong></span>
        <span>🐠 Dried Fish <strong id="storedDriedFishValue">0</strong></span>
        <span>🦭 Seals <strong id="sealCountValue">0</strong></span>
        <span>⏱ Phase <strong id="phaseValue">start</strong></span>
      </div>
      <button id="startButton" type="button">Start Colony</button>
    </header>

    <main class="game-layout" aria-label="Seal colony manager">
      <nav class="build-bar" aria-label="Build menu">
        <button class="tool-button active" id="selectToolButton" data-tool-mode="select" type="button">☝<span>Select</span></button>
        <button class="tool-button" id="buildFishingSpotToolButton" data-tool-mode="buildFishingSpot" type="button">🎣<span>Fishing Spot</span></button>
        <button class="tool-button" id="buildStorageToolButton" data-tool-mode="buildStorage" type="button">📦<span>Storage</span></button>
        <button class="tool-button" id="demolishToolButton" data-tool-mode="demolish" type="button">🧹<span>Demolish</span></button>
        <button class="tool-button" id="buildDryingRackToolButton" type="button" disabled>☀️<span>Drying Rack</span></button>
        <button class="tool-button" id="roadsToolButton" type="button" disabled>🛤<span>Roads</span></button>
        <button class="tool-button" id="researchToolButton" type="button" disabled>🔬<span>Research</span></button>
      </nav>

      <section class="map-card" aria-label="Map">
        <canvas id="gameCanvas" width="720" height="720" aria-label="Seal colony map" role="img"></canvas>
      </section>

      <aside class="inspector-panel" aria-label="Inspector">
        <h2>Inspector</h2>
        <div id="inspectorContent" class="inspector-content"></div>
      </aside>
    </main>

    <footer class="bottom-panel" aria-label="Population and jobs">
      <div><span>Total Seals</span><strong id="totalSealsValue">0</strong></div>
      <div><span>Idle</span><strong id="idleValue">0</strong></div>
      <div><span>Fishing Workers</span><strong id="fishingWorkersValue">0</strong></div>
      <div><span>Haulers</span><strong id="haulersValue">0</strong></div>
      <div><span>Wandering</span><strong id="wanderingValue">0</strong></div>
      <div class="message"><span>Status</span><strong id="messageValue">Ready</strong></div>
    </footer>
  </div>

  <script src="main.js"></script>
</body>
</html>
